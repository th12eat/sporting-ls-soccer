<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sporting LS · Team Homework</title>
  <meta name="description" content="Practice homework, drills, and video clips for our recreation soccer team." />

  <!-- Distinctive type: Fraunces (characterful display) + Space Mono (coach's chalkboard) + Nunito (friendly body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Sporting LS / Sporting KC palette */
      --sky:        #93d5f0;   /* Sporting light blue */
      --sky-bright: #b6e6fb;
      --navy:       #002b5c;   /* deep kit navy */
      --navy-2:     #01203f;
      --indigo:     #05386b;
      --chalk:      #f3f8ec;   /* chalk white on grass */
      --grass:      #3c7a1e;
      --grass-deep: #2c5c14;
      --gold:       #f2c14e;   /* whistle / captain accent */
      --ink:        #0b1a2b;
      --paper:      #fbfdff;

      --shadow-card: 0 18px 40px -18px rgba(0,20,50,.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Nunito", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 80% -10%, rgba(147,213,240,.35), transparent 60%),
        linear-gradient(180deg, #eef7fb 0%, #f7fbff 40%, #ffffff 100%);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Pitch-stripe hero ---------- */
    header.hero {
      position: relative;
      overflow: hidden;
      color: var(--chalk);
      background:
        repeating-linear-gradient(
          100deg,
          var(--grass) 0 60px,
          var(--grass-deep) 60px 120px
        );
      padding: clamp(2.2rem, 6vw, 4rem) clamp(1.2rem, 5vw, 3rem) clamp(3.5rem, 7vw, 5rem);
      box-shadow: inset 0 -8px 30px rgba(0,0,0,.25);
    }
    /* chalk pitch markings */
    header.hero::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 3px solid rgba(243,248,236,.55);
      border-radius: 10px;
      pointer-events: none;
    }
    header.hero::after {
      content: "";
      position: absolute;
      left: 50%; top: -60px;
      width: 160px; height: 160px;
      transform: translateX(-50%);
      border: 3px solid rgba(243,248,236,.55);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-inner { position: relative; max-width: 1000px; margin: 0 auto; }
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .back-link {
      font-family: "Space Mono", monospace; font-size: .74rem; font-weight: 700;
      letter-spacing: .06em; text-decoration: none; color: var(--navy-2);
      background: var(--sky-bright); padding: .35rem .8rem; border-radius: 999px;
      border: 1px solid rgba(243,248,236,.5); transition: transform .15s ease;
    }
    .back-link:hover { transform: translateY(-2px); }

    .badge {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: "Space Mono", monospace;
      font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      background: rgba(0,43,92,.55);
      border: 1px solid rgba(243,248,236,.35);
      padding: .35rem .75rem; border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

    h1.title {
      font-family: "Fraunces", serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      line-height: .98;
      margin: 1rem 0 .4rem;
      letter-spacing: -.02em;
      text-shadow: 0 3px 0 rgba(0,0,0,.18);
    }
    h1.title .em { color: var(--sky-bright); font-style: italic; }

    .subtitle {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      max-width: 46ch;
      color: rgba(243,248,236,.92);
      font-weight: 600;
    }

    .coach-note {
      margin-top: 1.4rem;
      display: flex; gap: .8rem; align-items: flex-start;
      background: rgba(1,32,63,.6);
      border: 1px solid rgba(243,248,236,.28);
      border-left: 4px solid var(--gold);
      padding: .85rem 1.1rem; border-radius: 12px;
      max-width: 60ch; font-size: .95rem;
      backdrop-filter: blur(4px);
    }
    .coach-note .whistle { font-size: 1.3rem; line-height: 1.2; }

    /* ---------- Layout ---------- */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 clamp(1.2rem, 5vw, 3rem) 5rem;
    }

    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem;
      margin: clamp(2rem, 5vw, 3.2rem) 0 1.2rem;
    }
    .section-head h2 {
      font-family: "Fraunces", serif;
      font-weight: 900; font-size: clamp(1.5rem, 4vw, 2.1rem);
      color: var(--navy); letter-spacing: -.01em;
    }
    .season-tag {
      font-family: "Space Mono", monospace; font-size: .8rem;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--grass-deep); background: rgba(60,122,30,.12);
      padding: .3rem .7rem; border-radius: 999px;
    }

    /* ---------- Practice card ---------- */
    .practice {
      background: var(--paper);
      border: 1px solid rgba(0,43,92,.1);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      margin-bottom: 1.6rem;
      opacity: 0; transform: translateY(18px);
      animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .practice.this-week { border: 2px solid var(--sky); box-shadow: 0 22px 50px -20px rgba(0,110,180,.5); }

    .practice-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.1rem 1.3rem;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(147,213,240,.16), rgba(147,213,240,0));
      user-select: none;
    }
    .practice-header:hover { background: linear-gradient(90deg, rgba(147,213,240,.3), rgba(147,213,240,.02)); }

    .cal {
      flex: none; width: 58px; text-align: center;
      background: var(--navy); color: var(--chalk);
      border-radius: 12px; padding: .35rem 0 .45rem;
      box-shadow: 0 6px 14px -6px rgba(0,43,92,.7);
    }
    .cal .mo { font-family: "Space Mono", monospace; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--sky-bright); }
    .cal .day { font-family: "Fraunces", serif; font-weight: 900; font-size: 1.5rem; line-height: 1; }

    .practice-titles { flex: 1; min-width: 0; }
    .practice-titles h3 {
      font-family: "Fraunces", serif; font-weight: 900;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem); color: var(--navy); line-height: 1.1;
    }
    .practice-titles .when { font-family: "Space Mono", monospace; font-size: .72rem; color: #5b6b7c; letter-spacing: .04em; }
    .thisweek-pill {
      display: inline-block; margin-left: .5rem; vertical-align: middle;
      font-family: "Space Mono", monospace; font-size: .6rem; text-transform: uppercase; letter-spacing: .1em;
      background: var(--gold); color: var(--navy-2); padding: .15rem .5rem; border-radius: 999px; font-weight: 700;
    }

    .chevron { flex: none; transition: transform .3s ease; color: var(--navy); font-size: 1.2rem; }
    .practice.open .chevron { transform: rotate(180deg); }

    .practice-body {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows .4s ease;
    }
    .practice.open .practice-body { grid-template-rows: 1fr; }
    .practice-body > .inner { overflow: hidden; }

    .summary {
      padding: 0 1.3rem 1rem;
      color: #33475b; font-size: .98rem;
    }
    .summary.flush { padding: 0; }
    .summary.hw-intro { padding: .2rem 1.3rem 0; font-style: italic; color: #46586a; }

    /* ---------- section bands (Warm-up / Drills / Scrimmage / Homework) ---- */
    .band {
      display: flex; align-items: center; gap: .5rem;
      font-family: "Space Mono", monospace;
      font-size: .74rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--navy); font-weight: 700;
      padding: .85rem 1.3rem .5rem;
      margin-top: .4rem;
      border-top: 2px solid rgba(0,43,92,.12);
      background: linear-gradient(90deg, rgba(147,213,240,.14), transparent);
    }
    .band-emoji { font-size: 1rem; }

    /* ---------- attendance -------------------------------------------------- */
    .attendance {
      display: flex; flex-wrap: wrap; gap: 1.2rem;
      padding: .2rem 1.3rem 1rem;
    }
    .att-group { flex: 1; min-width: 220px; }
    .att-title {
      font-family: "Space Mono", monospace; font-size: .72rem;
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem;
    }
    .att-group.present .att-title { color: var(--grass-deep); }
    .att-group.absent .att-title { color: #a24a2b; }
    .att-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .name-chip {
      font-size: .85rem; font-weight: 700;
      background: rgba(60,122,30,.14); color: var(--grass-deep);
      padding: .28rem .7rem; border-radius: 999px;
      border: 1px solid rgba(60,122,30,.25);
    }
    .name-chip.out {
      background: rgba(180,80,40,.1); color: #a24a2b;
      border-color: rgba(180,80,40,.25);
      text-decoration: line-through; text-decoration-thickness: 1px;
    }

    /* ---------- warm-up tick list ------------------------------------------ */
    ul.tick-list { list-style: none; margin: .6rem 0 0; padding: 0; }
    ul.tick-list li {
      position: relative; padding: .3rem 0 .3rem 1.7rem;
      font-size: .95rem; color: #26384a;
    }
    ul.tick-list li::before {
      content: "✓"; position: absolute; left: 0; top: .3rem;
      color: var(--grass); font-weight: 800;
    }

    /* ---------- homework extras -------------------------------------------- */
    .drill.homework { background: linear-gradient(180deg, rgba(242,193,78,.07), transparent 60%); }
    .hw-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin: .1rem 0 .7rem; }
    .chip {
      font-family: "Space Mono", monospace; font-size: .7rem;
      background: var(--navy); color: var(--chalk);
      padding: .28rem .6rem; border-radius: 6px; letter-spacing: .03em;
    }
    .concept {
      background: rgba(147,213,240,.16);
      border-left: 4px solid var(--sky);
      border-radius: 8px; padding: .7rem .9rem; margin: 0 0 .8rem;
    }
    .concept-label, .indoor-label {
      display: block; font-family: "Space Mono", monospace;
      font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 700; margin-bottom: .3rem;
    }
    .concept-label { color: var(--indigo); }
    .concept p { font-size: .92rem; color: #2c3e50; }
    .indoor {
      background: rgba(60,122,30,.08);
      border: 1px dashed rgba(60,122,30,.4);
      border-radius: 8px; padding: .7rem .9rem; margin-top: .8rem;
    }
    .indoor-label { color: var(--grass-deep); }
    .indoor p { font-size: .9rem; color: #2c3e50; }
    .drill.scrimmage { border-top: none; }

    /* ---------- Drills ---------- */
    .drill {
      border-top: 1px dashed rgba(0,43,92,.18);
      padding: 1.2rem 1.3rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      .drill.has-media { grid-template-columns: 1.1fr 1fr; align-items: start; }
    }

    .drill-name {
      font-family: "Fraunces", serif; font-weight: 900; font-size: 1.25rem; color: var(--indigo);
      display: flex; align-items: center; gap: .5rem;
    }
    .drill-name .ball { font-size: 1rem; }
    .drill-focus {
      display: inline-block; margin: .3rem 0 .8rem;
      font-family: "Space Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--grass-deep); background: rgba(60,122,30,.12);
      padding: .25rem .6rem; border-radius: 6px;
    }

    ol.steps { margin: .3rem 0 0 0; padding: 0; list-style: none; counter-reset: step; }
    ol.steps li {
      position: relative; padding: .35rem 0 .35rem 2rem;
      font-size: .95rem; color: #26384a;
      counter-increment: step;
    }
    ol.steps li::before {
      content: counter(step);
      position: absolute; left: 0; top: .35rem;
      width: 1.4rem; height: 1.4rem; border-radius: 50%;
      background: var(--sky); color: var(--navy-2);
      font-family: "Space Mono", monospace; font-weight: 700; font-size: .78rem;
      display: grid; place-items: center;
      box-shadow: 0 2px 0 rgba(0,43,92,.25);
    }

    /* media column */
    .media { display: flex; flex-direction: column; gap: .8rem; }
    .video-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      border-radius: 12px; overflow: hidden;
      background: var(--navy-2);
      box-shadow: 0 12px 26px -14px rgba(0,43,92,.7);
    }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* lazy video facade (loads YouTube only when clicked) */
    .video-facade {
      position: absolute; inset: 0; cursor: pointer; border: 0; padding: 0;
      background-size: cover; background-position: center;
      background-color: var(--navy-2);
      display: grid; place-items: center;
    }
    .video-facade::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,43,92,.05), rgba(0,43,92,.45));
    }
    .play-btn {
      position: relative; z-index: 1;
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(242,193,78,.95); display: grid; place-items: center;
      box-shadow: 0 8px 22px -6px rgba(0,0,0,.5); transition: transform .2s ease;
    }
    .video-facade:hover .play-btn { transform: scale(1.08); }
    .play-btn::before {
      content: ""; width: 0; height: 0; margin-left: 4px;
      border-left: 20px solid var(--navy-2);
      border-top: 12px solid transparent; border-bottom: 12px solid transparent;
    }

    .diagram-wrap {
      border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,43,92,.12);
      background: #fff;
    }
    .diagram-wrap img { display: block; width: 100%; height: auto; }
    .diagram-cap {
      font-family: "Space Mono", monospace; font-size: .66rem; letter-spacing: .08em;
      text-transform: uppercase; color: #6b7b8c; padding: .4rem .6rem; background: #f4f8fb;
    }

    /* ---------- coaches line ---------- */
    .coaches {
      margin-top: 1rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      font-family: "Space Mono", monospace; font-size: .82rem; letter-spacing: .03em;
      color: rgba(243,248,236,.95);
    }
    .coaches .whistle { font-size: 1rem; }
    .coaches #coach-list { font-weight: 700; }
    .venue-line {
      margin-top: .5rem; font-family: "Space Mono", monospace; font-size: .76rem;
      color: rgba(243,248,236,.85);
    }
    .loc-link {
      color: var(--sky-bright); text-decoration: none; font-weight: 700;
      border-bottom: 1px dotted rgba(182,230,251,.6);
    }
    .loc-link:hover { color: #fff; }
    .cal-btn {
      font-family: "Space Mono", monospace; font-size: .78rem; font-weight: 700;
      cursor: pointer; border: 0; margin-left: auto;
      background: var(--gold); color: var(--navy-2);
      padding: .5rem .9rem; border-radius: 999px; transition: transform .15s ease;
      white-space: nowrap;
    }
    .cal-btn:hover { transform: translateY(-2px); }
    .forecast {
      margin-top: .9rem; max-width: 60ch;
      background: rgba(1,32,63,.55); border: 1px solid rgba(243,248,236,.28);
      border-left: 4px solid var(--sky); border-radius: 12px;
      padding: .7rem 1rem; backdrop-filter: blur(4px);
    }
    .fc-line { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      font-family: "Space Mono", monospace; font-size: .82rem; color: rgba(243,248,236,.95); }
    .fc-when { font-weight: 700; }
    .fc-val { margin-left: auto; font-size: .9rem; color: var(--sky-bright); }
    .fc-val strong { color: #fff; }

    /* ---------- tabs ---------- */
    .tabs {
      position: sticky; top: 0; z-index: 20;
      display: flex; gap: .3rem; flex-wrap: wrap;
      padding: .6rem clamp(1.2rem, 5vw, 3rem);
      background: rgba(251,253,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,43,92,.12);
    }
    .tabs-inner { max-width: 1000px; margin: 0 auto; display: flex; gap: .3rem; flex-wrap: wrap; width: 100%; }
    .tab-btn {
      font-family: "Space Mono", monospace; font-size: .8rem; font-weight: 700;
      letter-spacing: .04em; cursor: pointer;
      background: transparent; color: #5b6b7c; border: 0;
      padding: .55rem .95rem; border-radius: 999px;
      transition: background .15s ease, color .15s ease;
    }
    .tab-btn:hover { background: rgba(147,213,240,.2); color: var(--navy); }
    .tab-btn.active { background: var(--navy); color: var(--chalk); }

    /* ---------- header meta chips (time + weather) ---------- */
    .hdr-chips { display: inline-flex; gap: .35rem; margin-left: .5rem; vertical-align: middle; flex-wrap: wrap; }
    .hdr-chip {
      font-family: "Space Mono", monospace; font-size: .64rem; font-weight: 700;
      padding: .15rem .5rem; border-radius: 999px; letter-spacing: .02em;
    }
    .hdr-chip.time { background: rgba(0,43,92,.1); color: var(--navy); }
    .hdr-chip.wx { background: rgba(242,193,78,.22); color: #8a6a12; }
    .hdr-chip.zone { cursor: help; }

    /* weather guideline banner (inside practice/game body + forecast) */
    .wx-guideline {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      background: rgba(0,43,92,.04);
      border: 1px solid rgba(0,43,92,.1); border-left: 5px solid #999;
      border-radius: 10px; padding: .6rem .8rem; margin: 0 1.3rem 1rem;
    }
    .wx-guideline.in-forecast { margin: .7rem 0 0; background: rgba(1,32,63,.5); border-color: rgba(243,248,236,.25); }
    .wx-guideline.in-forecast .wx-g-text { color: rgba(243,248,236,.95); }
    .wx-g-badge {
      flex: none; font-family: "Space Mono", monospace; font-size: .64rem; font-weight: 700;
      letter-spacing: .04em; color: #fff; padding: .2rem .55rem; border-radius: 999px;
    }
    .wx-g-text { font-size: .86rem; color: #33475b; font-weight: 600; }

    /* ---------- media diagram/video toggle ---------- */
    .media-toggle { display: inline-flex; gap: .25rem; background: rgba(0,43,92,.08); padding: .2rem; border-radius: 999px; align-self: flex-start; }
    .mt-btn {
      font-family: "Space Mono", monospace; font-size: .68rem; font-weight: 700;
      border: 0; cursor: pointer; background: transparent; color: #5b6b7c;
      padding: .3rem .7rem; border-radius: 999px; transition: background .15s, color .15s;
    }
    .mt-btn.active { background: var(--navy); color: var(--chalk); }

    /* ---------- collated / search ---------- */
    .search-box {
      width: 100%; font-family: "Nunito", sans-serif; font-size: 1rem;
      padding: .7rem 1rem; margin-bottom: 1.2rem;
      border: 2px solid rgba(0,43,92,.15); border-radius: 12px; background: #fff; color: var(--ink);
    }
    .search-box:focus { outline: none; border-color: var(--sky); }
    .collated .drill, .collated .drill.homework {
      background: var(--paper); border: 1px solid rgba(0,43,92,.1);
      border-radius: var(--radius); box-shadow: var(--shadow-card);
      margin-bottom: 1rem; border-top: 1px solid rgba(0,43,92,.1);
    }
    .from-tag {
      font-family: "Space Mono", monospace; font-size: .66rem; letter-spacing: .06em;
      color: #7787a0; margin-bottom: .3rem;
    }
    .empty { color: #5b6b7c; font-style: italic; padding: 1rem 0; }

    /* ---------- game scores ---------- */
    .score { font-family: "Fraunces", serif; font-weight: 900; margin-left: .4rem; padding: 0 .4rem; border-radius: 6px; }
    .score.win  { color: var(--grass-deep); background: rgba(60,122,30,.15); }
    .score.loss { color: #a24a2b; background: rgba(180,80,40,.12); }
    .score.tie  { color: var(--navy); background: rgba(0,43,92,.1); }

    /* ---------- roster ---------- */
    .roster { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .roster { grid-template-columns: 1fr 1fr; } }
    .roster-card {
      background: var(--paper); border: 1px solid rgba(0,43,92,.1);
      border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 1.1rem 1.2rem;
    }
    .roster-name {
      font-family: "Fraunces", serif; font-weight: 900; font-size: 1.25rem; color: var(--navy);
      display: flex; align-items: center; gap: .55rem; margin-bottom: .8rem;
    }
    .jersey {
      flex: none; width: 30px; height: 30px; border-radius: 50%;
      background: var(--sky); color: var(--navy-2);
      display: grid; place-items: center;
      font-family: "Space Mono", monospace; font-weight: 700; font-size: .82rem;
    }
    .roster-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    @media (max-width: 380px) { .roster-stats { grid-template-columns: repeat(3, 1fr); } }
    .stat {
      display: flex; flex-direction: column; align-items: center; gap: .1rem;
      background: rgba(147,213,240,.12); border-radius: 10px; padding: .5rem .3rem;
    }
    .stat.flag { background: rgba(242,193,78,.14); }
    .stat-val { font-family: "Fraunces", serif; font-weight: 900; font-size: 1.15rem; color: var(--indigo); }
    .stat-lbl { font-family: "Space Mono", monospace; font-size: .58rem; text-transform: uppercase; letter-spacing: .06em; color: #6b7b8c; }
    .mk { font-weight: 900; }
    .mk.yes { color: var(--grass); }
    .mk.no { color: #c0492b; }
    .mk.neutral { color: #9aa7b4; }
    .legend { font-family: "Space Mono", monospace; font-size: .72rem; color: #6b7b8c; margin-top: 1rem; }
    .legend .mk { margin-right: .1rem; }

    /* ---------- footer ---------- */
    footer {
      text-align: center; padding: 2.5rem 1rem 3rem; color: #5b6b7c; font-size: .85rem;
      font-family: "Space Mono", monospace; letter-spacing: .04em;
    }
    footer .heart { color: var(--grass); }

    /* stagger the cards */
    .practice:nth-child(1){animation-delay:.05s}
    .practice:nth-child(2){animation-delay:.13s}
    .practice:nth-child(3){animation-delay:.21s}
    .practice:nth-child(4){animation-delay:.29s}
    .practice:nth-child(5){animation-delay:.37s}

    @media (prefers-reduced-motion: reduce) {
      .practice { animation: none; opacity: 1; transform: none; }
      .practice-body { transition: none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <span class="badge"><span class="dot"></span> <span id="league-badge">Recreation League</span></span>
        <a class="back-link" href="../">← All teams</a>
      </div>
      <h1 class="title">Team <span class="em" id="hero-em">Practices</span></h1>
      <p class="subtitle" id="team-sub">Loading team…</p>
      <div class="coaches"><span class="whistle">📋</span> Coaches: <span id="coach-list">—</span></div>
      <div class="venue-line" id="venue"></div>
      <div class="forecast" id="forecast" style="display:none"></div>
    </div>
  </header>

  <nav class="tabs">
    <div class="tabs-inner">
      <button class="tab-btn active" data-tab="practice">Practices</button>
      <button class="tab-btn" data-tab="games">Games</button>
      <button class="tab-btn" data-tab="homework">Homework</button>
      <button class="tab-btn" data-tab="drills">Drills</button>
      <button class="tab-btn" data-tab="roster">Roster</button>
      <button class="cal-btn" id="cal-btn" style="display:none" title="Download all practices &amp; games as a calendar file">📅 Add to calendar</button>
    </div>
  </nav>

  <main>
    <!-- PRACTICE -->
    <section class="tab-panel" data-tab="practice">
      <div class="section-head">
        <h2>Practice History</h2>
        <span class="season-tag" id="season-tag">Season</span>
      </div>
      <div id="practices"></div>
    </section>

    <!-- GAMES -->
    <section class="tab-panel" data-tab="games" style="display:none">
      <div class="section-head"><h2>Game History</h2></div>
      <div id="games"></div>
    </section>

    <!-- HOMEWORK (collated + searchable) -->
    <section class="tab-panel" data-tab="homework" style="display:none">
      <div class="section-head"><h2>All Homework</h2></div>
      <div id="homework-list"></div>
    </section>

    <!-- DRILLS (collated + searchable) -->
    <section class="tab-panel" data-tab="drills" style="display:none">
      <div class="section-head"><h2>All Drills</h2></div>
      <div id="drills-list"></div>
    </section>

    <!-- ROSTER -->
    <section class="tab-panel" data-tab="roster" style="display:none">
      <div class="section-head"><h2>Team Roster</h2></div>
      <div id="roster-list"></div>
    </section>
  </main>

  <footer>
    Made for our players &amp; parents <span class="heart">⚽</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
