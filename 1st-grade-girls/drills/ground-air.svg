<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="'Space Mono', monospace">
  <rect width="400" height="240" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="240" lengthAdjust="spacingAndGlyphs">GROUND vs. AIR · ON DEMAND</text>

  <!-- kicking foot -->
  <text x="24" y="152" font-size="26">🦵</text>

  <!-- AIR pass: arc -->
  <path d="M70 140 Q 215 46 356 118" stroke="#f2c14e" stroke-width="3" stroke-dasharray="9 6" fill="none"/>
  <polygon points="356,118 344,108 349,122" fill="#f2c14e"/>
  <circle cx="70" cy="140" r="8" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.4"/>
  <text x="200" y="66" fill="#f2c14e" font-size="10" text-anchor="middle" textLength="230" lengthAdjust="spacingAndGlyphs">AIR — get UNDER the ball, lean back</text>

  <!-- GROUND pass: low straight dashed line -->
  <line x1="70" y1="172" x2="356" y2="172" stroke="#93d5f0" stroke-width="3" stroke-dasharray="9 6"/>
  <polygon points="356,172 342,165 342,179" fill="#93d5f0"/>
  <circle cx="70" cy="172" r="8" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.4"/>
  <text x="200" y="192" fill="#93d5f0" font-size="10" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">GROUND — strike the MIDDLE, ankle locked</text>

  <!-- distance flags -->
  <g stroke="#f3f8ec" stroke-width="1.5">
    <line x1="200" y1="206" x2="200" y2="220"/>
    <line x1="300" y1="206" x2="300" y2="220"/>
  </g>
  <text x="200" y="234" fill="#f3f8ec" font-size="8" opacity="0.8" text-anchor="middle">5 steps</text>
  <text x="300" y="234" fill="#f3f8ec" font-size="8" opacity="0.8" text-anchor="middle">10 steps</text>
</svg>
