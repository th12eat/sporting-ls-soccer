<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="'Space Mono', monospace">
  <rect width="400" height="260" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="248" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="230" lengthAdjust="spacingAndGlyphs">"ELSA" · FREEZE KEEP-AWAY</text>

  <!-- players with balls (blue) -->
  <g>
    <circle cx="90"  cy="90"  r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
    <circle cx="90"  cy="112" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
    <circle cx="300" cy="95"  r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
    <circle cx="300" cy="117" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  </g>

  <!-- frozen player: arms up, legs spread, ball above -->
  <g stroke="#f3f8ec" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="185" cy="150" r="10" fill="#f3f8ec"/>
    <line x1="185" y1="160" x2="185" y2="195"/>
    <line x1="185" y1="168" x2="168" y2="150"/>
    <line x1="185" y1="168" x2="202" y2="150"/>
    <line x1="185" y1="195" x2="168" y2="220"/>
    <line x1="185" y1="195" x2="202" y2="220"/>
  </g>
  <circle cx="185" cy="140" r="8" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.2"/>
  <!-- teammate dribbles through the frozen player's legs to unfreeze -->
  <path d="M150 235 Q 185 235 185 212" stroke="#f2c14e" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
  <polygon points="185,212 179,222 191,221" fill="#f2c14e"/>
  <text x="185" y="245" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.85">unfreeze: dribble through the legs!</text>

  <!-- "Elsa" attacker (orange, no ball) -->
  <circle cx="245" cy="175" r="13" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/>
  <text x="245" y="178" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">E</text>
  <text x="330" y="180" fill="#ff7a3d" font-size="9" text-anchor="middle">Elsa = no ball,</text>
  <text x="330" y="192" fill="#ff7a3d" font-size="9" text-anchor="middle">kicks yours out</text>
</svg>
