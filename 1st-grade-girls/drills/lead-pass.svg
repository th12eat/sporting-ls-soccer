<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="'Space Mono', monospace">
  <rect width="400" height="240" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="240" lengthAdjust="spacingAndGlyphs">LEAD &amp; PASS · MOVING</text>

  <!-- two players ~8ft apart, jogging right, passing between them -->
  <g>
    <circle cx="90" cy="90"  r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="90" y="93" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">A</text>
    <circle cx="90" cy="160" r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="90" y="163" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">B</text>
  </g>
  <!-- ghost positions further down field -->
  <g opacity="0.5">
    <circle cx="270" cy="90"  r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
    <circle cx="270" cy="160" r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
  </g>

  <!-- travel arrows (both jog down field) -->
  <g stroke="#f3f8ec" stroke-width="2" stroke-dasharray="4 5" fill="none">
    <line x1="105" y1="90" x2="255" y2="90"/>
    <line x1="105" y1="160" x2="255" y2="160"/>
  </g>

  <!-- passes zig-zag between them, led ahead -->
  <g stroke="#f2c14e" stroke-width="3" fill="none">
    <line x1="103" y1="98" x2="175" y2="152"/>
    <line x1="185" y1="152" x2="255" y2="98"/>
  </g>
  <polygon points="175,152 163,148 170,160" fill="#f2c14e"/>
  <polygon points="255,98 243,98 250,110" fill="#f2c14e"/>
  <circle cx="103" cy="98" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>

  <text x="330" y="125" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.85">jog together →</text>
  <text x="200" y="222" fill="#f3f8ec" font-size="9" text-anchor="middle" opacity="0.85">pass AHEAD so your partner runs onto it</text>
</svg>
