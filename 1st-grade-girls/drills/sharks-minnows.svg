<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="'Space Mono', monospace">
  <rect width="400" height="240" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="220" lengthAdjust="spacingAndGlyphs">SHARKS &amp; MINNOWS</text>

  <!-- safe zones -->
  <line x1="60" y1="45" x2="60" y2="225" stroke="#f3f8ec" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="340" y1="45" x2="340" y2="225" stroke="#f3f8ec" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- minnows with balls on the left -->
  <g>
    <circle cx="40" cy="80"  r="12" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><circle cx="40" cy="99" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
    <circle cx="40" cy="140" r="12" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><circle cx="40" cy="159" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
    <circle cx="40" cy="200" r="12" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><circle cx="40" cy="219" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  </g>
  <!-- sharks in the middle -->
  <circle cx="200" cy="110" r="13" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="200" y="113" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">S</text>
  <circle cx="210" cy="170" r="13" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="210" y="173" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">S</text>

  <!-- dribble arrows toward safe side -->
  <g stroke="#f2c14e" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <line x1="60" y1="80" x2="330" y2="80"/>
  </g>
  <polygon points="332,80 320,73 320,87" fill="#f2c14e"/>

  <text x="45" y="40" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">start</text>
  <text x="350" y="40" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">safe</text>
  <text x="200" y="222" fill="#f3f8ec" font-size="9" text-anchor="middle" opacity="0.85">dribble across without losing your ball!</text>
</svg>
