<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="'Space Mono', monospace">
  <rect width="400" height="260" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="248" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">SHOOTING · GIVE &amp; GO</text>

  <!-- goal at top -->
  <rect x="150" y="34" width="100" height="12" fill="none" stroke="#f3f8ec" stroke-width="3"/>
  <text x="200" y="60" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">GOAL</text>

  <!-- player start (bottom) -->
  <circle cx="120" cy="210" r="13" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="120" y="213" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">1</text>
  <circle cx="120" cy="228" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  <!-- coach -->
  <circle cx="250" cy="170" r="13" fill="#f2c14e" stroke="#002b5c" stroke-width="2"/><text x="250" y="173" fill="#002b5c" font-size="7.5" font-weight="700" text-anchor="middle">C</text>

  <!-- 1: pass to coach -->
  <line x1="132" y1="205" x2="238" y2="176" stroke="#f2c14e" stroke-width="3" fill="none"/>
  <polygon points="238,176 226,175 231,187" fill="#f2c14e"/>
  <text x="185" y="205" fill="#f2c14e" font-size="8" text-anchor="middle">1 · pass to coach</text>

  <!-- 2: coach returns with a lead -->
  <line x1="240" y1="162" x2="180" y2="120" stroke="#93d5f0" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
  <polygon points="180,120 192,122 187,133" fill="#93d5f0"/>
  <text x="140" y="150" fill="#93d5f0" font-size="8" text-anchor="middle">2 · lead return</text>

  <!-- 3: run onto it and shoot -->
  <line x1="175" y1="112" x2="200" y2="52" stroke="#fff" stroke-width="3" fill="none"/>
  <polygon points="200,52 191,60 204,63" fill="#fff"/>
  <text x="235" y="100" fill="#fff" font-size="8" text-anchor="middle">3 · run &amp; shoot!</text>
</svg>
