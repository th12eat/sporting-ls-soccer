<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Space Mono', monospace">
  <rect width="400" height="300" fill="#2c5c14"/>
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="380" height="45"/>
    <rect x="10" y="100" width="380" height="45"/>
    <rect x="10" y="190" width="380" height="45"/>
    <rect x="10" y="250" width="380" height="45"/>
  </g>
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.6" stroke-width="2">
    <rect x="12" y="12" width="376" height="276" rx="4"/>
    <!-- our goal + box at the bottom -->
    <rect x="120" y="248" width="160" height="40"/>
    <rect x="170" y="288" width="60" height="6" fill="#f3f8ec"/>
  </g>
  <text x="200" y="30" fill="#f3f8ec" font-size="12" font-weight="700" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">SET PIECES WITH THE GOALIE</text>

  <!-- goalie in the goal -->
  <circle cx="200" cy="266" r="13" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="200" y="269" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">GK</text>
  <circle cx="200" cy="248" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>

  <!-- goal kick: GK/back plays it wide to spread-out teammates -->
  <g stroke="#8fd0a0" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <line x1="192" y1="242" x2="80" y2="170"/>
    <line x1="208" y1="242" x2="320" y2="170"/>
  </g>
  <polygon points="80,170 90,175 87,163" fill="#8fd0a0"/>
  <polygon points="320,170 313,163 310,175" fill="#8fd0a0"/>
  <circle cx="80" cy="165" r="11" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
  <circle cx="320" cy="165" r="11" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
  <text x="200" y="150" fill="#8fd0a0" font-size="8.5" text-anchor="middle">GOAL KICK: spread wide, GK plays out to the sides</text>

  <!-- defending a corner: goalie owns the box -->
  <path d="M20 20 q 90 40 160 90" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <polygon points="180,110 168,104 170,116" fill="#f2c14e"/>
  <circle cx="20" cy="20" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  <text x="95" y="70" fill="#f2c14e" font-size="8" text-anchor="middle">incoming corner</text>
  <text x="200" y="200" fill="#f3f8ec" font-size="8.5" text-anchor="middle" opacity="0.9">On corners the GK is boss of the box — call "keeper!" and go get it.</text>
</svg>
