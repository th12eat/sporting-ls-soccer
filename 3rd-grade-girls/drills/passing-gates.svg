<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="'Space Mono', monospace">
  <rect width="400" height="220" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="208" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <!-- gate in the middle -->
  <g fill="#ff7a3d">
    <polygon points="200,90 208,113 192,113"/>
    <polygon points="200,150 208,127 192,127"/>
  </g>
  <!-- pass path -->
  <path d="M70 120 L 330 120" fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>
  <polygon points="330,120 316,113 316,127" fill="#f2c14e"/>
  <!-- players -->
  <text x="46" y="128" fill="#f3f8ec" font-size="20">🧍‍♀️</text>
  <text x="336" y="128" fill="#f3f8ec" font-size="20">🧍‍♀️</text>
  <!-- ball -->
  <circle cx="90" cy="120" r="9" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
  <circle cx="90" cy="120" r="2.5" fill="#0b1a2b"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="270" lengthAdjust="spacingAndGlyphs">PASSING GATES · 8–10 FT APART</text>
  <text x="200" y="175" fill="#f3f8ec" font-size="11" opacity="0.85" text-anchor="middle">pass through the gate →</text>
</svg>
