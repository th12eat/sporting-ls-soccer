<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Space Mono', monospace">
  <rect width="400" height="300" fill="#2c5c14"/>
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="380" height="45"/>
    <rect x="10" y="100" width="380" height="45"/>
    <rect x="10" y="190" width="380" height="45"/>
  </g>
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.6" stroke-width="2">
    <rect x="12" y="12" width="376" height="276" rx="4"/>
    <!-- goal at top -->
    <rect x="150" y="12" width="100" height="42"/>
    <rect x="175" y="6" width="50" height="6" fill="#f3f8ec"/>
  </g>
  <text x="200" y="34" fill="#f3f8ec" font-size="12" font-weight="700" text-anchor="middle">CROSSING</text>

  <!-- winger dribbles up the right side -->
  <circle cx="340" cy="230" r="12" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="340" y="233" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">RW</text>
  <path d="M340 216 L 340 110" stroke="#f3f8ec" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <circle cx="340" cy="105" r="7" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.2"/>

  <!-- cross into the middle -->
  <path d="M332 100 Q 250 70 205 95" stroke="#f2c14e" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <polygon points="205,95 217,92 212,104" fill="#f2c14e"/>
  <text x="270" y="130" fill="#f2c14e" font-size="9" text-anchor="middle">cross to the box →</text>

  <!-- forward arriving to finish -->
  <circle cx="190" cy="105" r="12" fill="#f2c14e" stroke="#002b5c" stroke-width="2"/><text x="190" y="108" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">F</text>
  <path d="M150 160 L 185 118" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <polygon points="185,118 174,122 182,128" fill="#fff"/>

  <text x="200" y="272" fill="#f3f8ec" font-size="9" text-anchor="middle" opacity="0.9">Get wide, look up, drive it across in front of goal.</text>
</svg>
