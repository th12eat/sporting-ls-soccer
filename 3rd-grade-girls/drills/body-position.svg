<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="'Space Mono', monospace">
  <rect width="400" height="260" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="248" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">BODY POSITION · DO &amp; DON'T</text>

  <!-- DO: side-on, between ball and goal -->
  <text x="105" y="52" fill="#8fd0a0" font-size="10" font-weight="700" text-anchor="middle">✓ DO</text>
  <!-- defender side-on -->
  <g stroke="#8fd0a0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="105" cy="80" r="9" fill="#8fd0a0"/>
    <line x1="105" y1="89" x2="105" y2="120"/>
    <line x1="105" y1="98" x2="90" y2="112"/>
    <line x1="105" y1="98" x2="120" y2="112"/>
    <line x1="105" y1="120" x2="94" y2="140"/>
    <line x1="105" y1="120" x2="116" y2="140"/>
  </g>
  <circle cx="140" cy="135" r="8" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.2"/>
  <text x="105" y="165" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">stay side-on,</text>
  <text x="105" y="177" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">goal-side of the ball</text>
  <text x="105" y="193" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">shoulder-to-shoulder</text>
  <text x="105" y="205" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">to win the ball</text>

  <!-- divider -->
  <line x1="200" y1="45" x2="200" y2="215" stroke="#f3f8ec" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- DON'T: pushing / two hands -->
  <text x="295" y="52" fill="#ff7a3d" font-size="10" font-weight="700" text-anchor="middle">✗ DON'T</text>
  <g stroke="#ff7a3d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="285" cy="80" r="9" fill="#ff7a3d"/>
    <line x1="285" y1="89" x2="285" y2="120"/>
    <line x1="285" y1="96" x2="315" y2="100"/>
    <line x1="285" y1="102" x2="315" y2="106"/>
    <line x1="285" y1="120" x2="274" y2="140"/>
    <line x1="285" y1="120" x2="296" y2="140"/>
  </g>
  <!-- pushed player falling -->
  <g stroke="#f3f8ec" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <circle cx="335" cy="95" r="8" fill="#f3f8ec"/>
    <line x1="335" y1="103" x2="345" y2="128"/>
    <line x1="335" y1="110" x2="322" y2="120"/>
    <line x1="345" y1="128" x2="338" y2="145"/>
    <line x1="345" y1="128" x2="352" y2="145"/>
  </g>
  <text x="300" y="170" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">no pushing with</text>
  <text x="300" y="182" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">hands / two arms</text>
  <text x="300" y="198" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.9">no shoving from behind</text>

  <text x="200" y="238" fill="#f2c14e" font-size="9" text-anchor="middle">Contact is OK shoulder-to-shoulder — not with your hands!</text>
</svg>
