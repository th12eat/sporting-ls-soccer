<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="'Space Mono', monospace">
  <rect width="400" height="260" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="248" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="230" lengthAdjust="spacingAndGlyphs">TRAPPING · FIRST TOUCH</text>

  <!-- three surfaces -->
  <g font-size="9" fill="#f3f8ec" text-anchor="middle" font-weight="700">
    <text x="90"  y="58">INSIDE FOOT</text>
    <text x="200" y="58">SOLE (top)</text>
    <text x="310" y="58">THIGH / CHEST</text>
  </g>

  <!-- inside foot trap: incoming ball + cushion -->
  <g transform="translate(90,120)">
    <circle cx="0" cy="30" r="15" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M-28 40 L 12 40 L 16 48 L -32 48 Z" fill="#93d5f0"/>
    <path d="M35 5 q -20 15 -18 22" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
    <polygon points="17,27 10,17 24,20" fill="#f2c14e"/>
    <text x="0" y="72" fill="#f3f8ec" font-size="7.5" text-anchor="middle" opacity="0.9">open foot, cushion</text>
  </g>
  <!-- sole trap -->
  <g transform="translate(200,120)">
    <circle cx="0" cy="34" r="15" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M-22 12 L 18 12 L 22 20 L -26 20 Z" fill="#93d5f0"/>
    <path d="M0 -18 L 0 12" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polygon points="0,12 -6,2 6,2" fill="#f2c14e"/>
    <text x="0" y="72" fill="#f3f8ec" font-size="7.5" text-anchor="middle" opacity="0.9">foot on top, soft</text>
  </g>
  <!-- thigh/chest -->
  <g transform="translate(310,120)">
    <g stroke="#93d5f0" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-6" r="8" fill="#93d5f0"/>
      <line x1="0" y1="2" x2="0" y2="34"/>
    </g>
    <circle cx="0" cy="18" r="12" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M28 -20 q -22 20 -18 30" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
    <text x="0" y="72" fill="#f3f8ec" font-size="7.5" text-anchor="middle" opacity="0.9">relax, drop it down</text>
  </g>

  <text x="200" y="230" fill="#f2c14e" font-size="9" text-anchor="middle" textLength="330" lengthAdjust="spacingAndGlyphs">"Cushion" the ball — give a little as it arrives so it stays close.</text>
</svg>
