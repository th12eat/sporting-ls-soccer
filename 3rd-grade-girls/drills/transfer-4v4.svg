<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="'Space Mono', monospace">
  <rect width="400" height="260" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="248" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle" textLength="230" lengthAdjust="spacingAndGlyphs">4v4 TRANSFER · 5 PASSES</text>

  <!-- zone dividers -->
  <line x1="140" y1="40" x2="140" y2="225" stroke="#f3f8ec" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="260" y1="40" x2="260" y2="225" stroke="#f3f8ec" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- LEFT team (blue) 4 players -->
  <g fill="#93d5f0" stroke="#002b5c" stroke-width="2">
    <circle cx="55" cy="70" r="12"/><circle cx="100" cy="110" r="12"/>
    <circle cx="55" cy="160" r="12"/><circle cx="100" cy="200" r="12"/>
  </g>
  <!-- passes among the left team -->
  <g stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.9">
    <path d="M67 76 L 90 102"/>
    <path d="M96 122 L 63 150"/>
    <path d="M67 168 L 90 190"/>
  </g>

  <!-- MIDDLE defenders (orange) 4 -->
  <g fill="#ff7a3d" stroke="#002b5c" stroke-width="2">
    <circle cx="175" cy="80" r="12"/><circle cx="225" cy="120" r="12"/>
    <circle cx="175" cy="170" r="12"/><circle cx="225" cy="200" r="12"/>
  </g>
  <text x="200" y="150" fill="#ff7a3d" font-size="8" text-anchor="middle" font-weight="700">4 DEFENDERS</text>

  <!-- RIGHT team (green) 4 -->
  <g fill="#8fd0a0" stroke="#002b5c" stroke-width="2">
    <circle cx="300" cy="70" r="12"/><circle cx="345" cy="110" r="12"/>
    <circle cx="300" cy="160" r="12"/><circle cx="345" cy="200" r="12"/>
  </g>

  <!-- the transfer pass across the middle -->
  <path d="M105 110 Q 200 55 295 105" stroke="#fff" stroke-width="3" fill="none"/>
  <polygon points="295,105 283,101 288,113" fill="#fff"/>
  <text x="200" y="52" fill="#fff" font-size="8.5" text-anchor="middle">after 5 passes → transfer across</text>

  <text x="70" y="238" fill="#93d5f0" font-size="8" text-anchor="middle">Team A</text>
  <text x="200" y="238" fill="#ff7a3d" font-size="8" text-anchor="middle">win it in the middle</text>
  <text x="330" y="238" fill="#8fd0a0" font-size="8" text-anchor="middle">Team B</text>
</svg>
