<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 430" font-family="'Space Mono', monospace">
  <rect width="300" height="430" fill="#2c5c14"/>
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="280" height="45"/>
    <rect x="10" y="100" width="280" height="45"/>
    <rect x="10" y="190" width="280" height="45"/>
    <rect x="10" y="280" width="280" height="45"/>
    <rect x="10" y="370" width="280" height="45"/>
  </g>
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.65" stroke-width="2">
    <rect x="14" y="14" width="272" height="402" rx="4"/>
    <line x1="14" y1="215" x2="286" y2="215"/>
    <circle cx="150" cy="215" r="34"/>
    <rect x="95" y="14" width="110" height="46"/>
    <rect x="125" y="6" width="50" height="8" fill="#f3f8ec"/>
    <rect x="95" y="370" width="110" height="46"/>
    <rect x="125" y="416" width="50" height="8" fill="#f3f8ec"/>
  </g>
  <text x="150" y="30" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">ATTACK ▲</text>
  <text x="150" y="45" fill="#f2c14e" font-size="9" text-anchor="middle" font-weight="700">STANDARD 11v11 · 3–4–3</text>

  <g font-size="8" font-weight="700" text-anchor="middle">
    <!-- front 3 -->
    <g><circle cx="60"  cy="82" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="60"  y="85" fill="#002b5c">LW</text></g>
    <g><circle cx="150" cy="72" r="14" fill="#f2c14e" stroke="#002b5c" stroke-width="2"/><text x="150" y="75" fill="#002b5c">F</text></g>
    <g><circle cx="240" cy="82" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="240" y="85" fill="#002b5c">RW</text></g>
    <!-- CAM -->
    <g><circle cx="150" cy="140" r="14" fill="#8fd0a0" stroke="#002b5c" stroke-width="2"/><text x="150" y="143" fill="#002b5c">CAM</text></g>
    <!-- midfield line (LM RM) -->
    <g><circle cx="55"  cy="180" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="55"  y="183" fill="#002b5c">LM</text></g>
    <g><circle cx="245" cy="180" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="245" y="183" fill="#002b5c">RM</text></g>
    <!-- CDM -->
    <g><circle cx="150" cy="225" r="14" fill="#8fb8d0" stroke="#002b5c" stroke-width="2"/><text x="150" y="228" fill="#002b5c">CDM</text></g>
    <!-- back 3 -->
    <g><circle cx="60"  cy="300" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="60"  y="303" fill="#002b5c">LB</text></g>
    <g><circle cx="150" cy="315" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="150" y="318" fill="#002b5c">CB</text></g>
    <g><circle cx="240" cy="300" r="14" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="240" y="303" fill="#002b5c">RB</text></g>
    <!-- keeper -->
    <g><circle cx="150" cy="392" r="14" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="150" y="395" fill="#002b5c">GK</text></g>
  </g>
  <text x="150" y="412" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">OUR GOAL ▼</text>
</svg>
