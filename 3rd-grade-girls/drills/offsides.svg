<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Space Mono', monospace">
  <rect width="400" height="300" fill="#2c5c14"/>
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="380" height="45"/>
    <rect x="10" y="100" width="380" height="45"/>
    <rect x="10" y="190" width="380" height="45"/>
  </g>
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.6" stroke-width="2">
    <rect x="12" y="12" width="376" height="276" rx="4"/>
    <!-- goal at top (attacking) -->
    <rect x="150" y="12" width="100" height="40"/>
    <rect x="175" y="6" width="50" height="6" fill="#f3f8ec"/>
  </g>
  <text x="200" y="34" fill="#f3f8ec" font-size="12" font-weight="700" text-anchor="middle">OFFSIDES</text>

  <!-- last defender line -->
  <line x1="12" y1="120" x2="388" y2="120" stroke="#ff7a3d" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="330" y="114" fill="#ff7a3d" font-size="8" text-anchor="middle">last defender</text>
  <!-- last defender player -->
  <circle cx="110" cy="120" r="12" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="110" y="123" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">D</text>

  <!-- OFFSIDE attacker (past the line, ahead of ball) -->
  <circle cx="230" cy="80" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="230" y="83" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">✗</text>
  <text x="230" y="66" fill="#c0392b" font-size="8" text-anchor="middle">OFFSIDE</text>

  <!-- ONSIDE attacker (level/behind the line) -->
  <circle cx="180" cy="150" r="12" fill="#8fd0a0" stroke="#002b5c" stroke-width="2"/><text x="180" y="153" fill="#002b5c" font-size="8" font-weight="700" text-anchor="middle">✓</text>
  <text x="180" y="176" fill="#8fd0a0" font-size="8" text-anchor="middle">onside</text>

  <!-- passer with ball -->
  <circle cx="150" cy="230" r="12" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/>
  <circle cx="150" cy="248" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  <text x="150" y="270" fill="#93d5f0" font-size="8" text-anchor="middle">passer</text>

  <text x="200" y="292" fill="#f3f8ec" font-size="8.5" text-anchor="middle" opacity="0.9">Stay level with or behind the last defender until the ball is played.</text>
</svg>
