<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Space Mono', monospace">
  <rect width="400" height="300" fill="#2c5c14"/>
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="380" height="40"/>
    <rect x="10" y="90" width="380" height="40"/>
    <rect x="10" y="170" width="380" height="40"/>
    <rect x="10" y="250" width="380" height="40"/>
  </g>
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.6" stroke-width="2">
    <rect x="12" y="12" width="376" height="276" rx="4"/>
    <line x1="12" y1="150" x2="388" y2="150"/>
    <circle cx="200" cy="150" r="30"/>
    <!-- top goal + box -->
    <rect x="150" y="12" width="100" height="40"/>
    <rect x="175" y="6" width="50" height="6" fill="#f3f8ec"/>
    <!-- bottom goal + box -->
    <rect x="150" y="248" width="100" height="40"/>
    <rect x="175" y="288" width="50" height="6" fill="#f3f8ec"/>
  </g>
  <text x="200" y="34" fill="#f3f8ec" font-size="12" font-weight="700" text-anchor="middle">SET PIECES</text>

  <!-- Kick off: center circle -->
  <circle cx="200" cy="150" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.2"/>
  <text x="200" y="140" fill="#f2c14e" font-size="8.5" text-anchor="middle">KICK-OFF (center)</text>

  <!-- Corner: top-left corner arc + arrow to box -->
  <path d="M20 20 q 60 10 130 20" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <polygon points="150,40 138,34 140,46" fill="#f2c14e"/>
  <circle cx="20" cy="20" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  <text x="70" y="70" fill="#93d5f0" font-size="8.5" text-anchor="middle">CORNER →</text>
  <text x="70" y="82" fill="#93d5f0" font-size="8.5" text-anchor="middle">into the box</text>

  <!-- Goal kick: from our box outward -->
  <circle cx="200" cy="262" r="5" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1"/>
  <g stroke="#8fd0a0" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <line x1="200" y1="256" x2="120" y2="200"/>
    <line x1="200" y1="256" x2="280" y2="200"/>
  </g>
  <polygon points="120,200 130,205 126,193" fill="#8fd0a0"/>
  <polygon points="280,200 274,193 270,205" fill="#8fd0a0"/>
  <text x="200" y="280" fill="#8fd0a0" font-size="8.5" text-anchor="middle">GOAL KICK: spread wide, play out</text>
</svg>
