<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="'Space Mono', monospace">
  <rect width="400" height="240" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="20" y="28" fill="#f3f8ec" font-size="13" font-weight="700">ROLL / PULLBACK</text>

  <!-- three step frames -->
  <g font-size="9" fill="#f3f8ec" text-anchor="middle">
    <text x="90"  y="55">1 · sole on top</text>
    <text x="200" y="55">2 · roll it back</text>
    <text x="310" y="55">3 · turn &amp; go</text>
  </g>

  <!-- frame 1: foot on top of ball -->
  <g transform="translate(90,120)">
    <circle cx="0" cy="30" r="16" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M-20 8 L 18 8 L 22 16 L -22 16 Z" fill="#ff7a3d"/>
    <text x="0" y="70" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.85">toe up, sole down</text>
  </g>
  <!-- frame 2: ball rolling back, arrow -->
  <g transform="translate(200,120)">
    <path d="M-18 12 L 18 12 L 22 20 L -22 20 Z" fill="#ff7a3d"/>
    <circle cx="-2" cy="42" r="16" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M20 40 q 20 6 20 -10" stroke="#f2c14e" stroke-width="3" fill="none"/>
    <polygon points="40,30 34,42 46,40" fill="#f2c14e"/>
    <text x="0" y="78" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.85">drag under, backward</text>
  </g>
  <!-- frame 3: turn -->
  <g transform="translate(310,120)">
    <circle cx="0" cy="42" r="16" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.5"/>
    <path d="M-40 42 q 20 -40 44 -2" stroke="#f2c14e" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
    <polygon points="4,38 -6,30 0,44" fill="#f2c14e"/>
    <text x="0" y="78" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.85">accelerate away</text>
  </g>
</svg>
