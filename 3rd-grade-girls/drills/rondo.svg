<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="'Space Mono', monospace">
  <rect width="400" height="240" fill="#2c5c14"/>
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#f3f8ec" stroke-opacity="0.5" stroke-width="2" rx="6"/>
  <text x="200" y="28" fill="#f3f8ec" font-size="13" font-weight="700" text-anchor="middle">RONDO · 3v1 (KEEP-AWAY)</text>

  <!-- outside players (blue) forming a triangle -->
  <g>
    <circle cx="120" cy="80"  r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="120" y="84" fill="#002b5c" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <circle cx="290" cy="95"  r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="290" y="99" fill="#002b5c" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <circle cx="205" cy="195" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="205" y="199" fill="#002b5c" font-size="10" font-weight="700" text-anchor="middle">3</text>
  </g>
  <!-- defender in the middle (orange) -->
  <circle cx="200" cy="120" r="15" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/>
  <text x="200" y="124" fill="#002b5c" font-size="9" font-weight="700" text-anchor="middle">D</text>

  <!-- passing lanes around the outside -->
  <g stroke="#f2c14e" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <path d="M135 88 Q 220 60 278 90"/>
    <path d="M285 108 Q 260 175 220 190"/>
    <path d="M190 188 Q 120 150 128 94"/>
  </g>
  <polygon points="278,90 266,84 270,96" fill="#f2c14e"/>
  <!-- ball -->
  <circle cx="120" cy="80" r="6" fill="#f3f8ec" stroke="#0b1a2b" stroke-width="1.2"/>
  <text x="200" y="225" fill="#f3f8ec" font-size="10" opacity="0.85" text-anchor="middle" textLength="376" lengthAdjust="spacingAndGlyphs">3 keep the ball · 1 tries to win it · switch when D touches it</text>
</svg>
