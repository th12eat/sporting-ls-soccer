<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 430" font-family="'Space Mono', monospace">
  <rect width="300" height="430" fill="#2c5c14"/>
  <!-- mowing stripes -->
  <g fill="#347017" opacity="0.5">
    <rect x="10" y="10" width="280" height="45"/>
    <rect x="10" y="100" width="280" height="45"/>
    <rect x="10" y="190" width="280" height="45"/>
    <rect x="10" y="280" width="280" height="45"/>
    <rect x="10" y="370" width="280" height="45"/>
  </g>
  <!-- pitch lines -->
  <g fill="none" stroke="#f3f8ec" stroke-opacity="0.65" stroke-width="2">
    <rect x="14" y="14" width="272" height="402" rx="4"/>
    <line x1="14" y1="215" x2="286" y2="215"/>
    <circle cx="150" cy="215" r="34"/>
    <!-- top goal + box (attacking) -->
    <rect x="95" y="14" width="110" height="46"/>
    <rect x="125" y="6" width="50" height="8" fill="#f3f8ec"/>
    <!-- bottom goal + box (our goal) -->
    <rect x="95" y="370" width="110" height="46"/>
    <rect x="125" y="416" width="50" height="8" fill="#f3f8ec"/>
  </g>
  <text x="150" y="30" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">ATTACK ▲</text>

  <!-- position markers: blue dots with labels -->
  <g font-size="8.5" font-weight="700" text-anchor="middle">
    <!-- forward line -->
    <g><circle cx="60"  cy="90" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="60"  y="93" fill="#002b5c">LW</text></g>
    <g><circle cx="150" cy="78" r="15" fill="#f2c14e" stroke="#002b5c" stroke-width="2"/><text x="150" y="81" fill="#002b5c">F</text></g>
    <g><circle cx="240" cy="90" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="240" y="93" fill="#002b5c">RW</text></g>
    <!-- midfield -->
    <g><circle cx="60"  cy="185" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="60"  y="188" fill="#002b5c">LM</text></g>
    <g><circle cx="150" cy="200" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="150" y="203" fill="#002b5c">CM</text></g>
    <g><circle cx="240" cy="185" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="240" y="188" fill="#002b5c">RM</text></g>
    <!-- defense -->
    <g><circle cx="60"  cy="295" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="60"  y="298" fill="#002b5c">LB</text></g>
    <g><circle cx="150" cy="308" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="150" y="311" fill="#002b5c">CB</text></g>
    <g><circle cx="240" cy="295" r="15" fill="#93d5f0" stroke="#002b5c" stroke-width="2"/><text x="240" y="298" fill="#002b5c">RB</text></g>
    <!-- keeper -->
    <g><circle cx="150" cy="392" r="15" fill="#ff7a3d" stroke="#002b5c" stroke-width="2"/><text x="150" y="395" fill="#002b5c">GK</text></g>
  </g>
  <text x="150" y="412" fill="#f3f8ec" font-size="8" text-anchor="middle" opacity="0.8">OUR GOAL ▼</text>
</svg>
